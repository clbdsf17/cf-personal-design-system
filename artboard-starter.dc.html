<style>
/* ============================================================
   CF Personal — design tokens
   Drop-in stylesheet. Inline this whole file inside a <style> block
   in any self-contained page (Claude Design artboards, Artifacts,
   standalone HTML). Extracted verbatim from design.html — do not
   hand-edit; regenerate if the system changes.

   Canonical spec: ~/.claude/design-system/design.md
   Requires: <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

   Hard rules — the ones a generator breaks by default:
     - radius is ONLY var(--rounded-none) or var(--rounded-full)
     - no box-shadow, no gradient, no blur, no glow
     - expressive-* colours never touch a button, link or control
     - one expressive colour per composition
   ============================================================ */

:root {
  --color-background: #F4F3F1;
  --color-surface: #FFFFFF;
  --color-surface-sunken: #EAE8E4;
  --color-on-background: #0D0D0D;
  --color-on-surface: #0D0D0D;
  --color-on-surface-muted: #6B6B66;
  --color-on-surface-subtle: #8F8F89;
  --color-border: #DFDDD8;
  --color-border-strong: #0D0D0D;

  --color-action: #0D0D0D;
  --color-on-action: #FFFFFF;
  --color-action-hover: #262626;
  --color-action-active: #000000;
  --color-action-disabled: #C9C7C2;
  --color-on-action-disabled: #8F8F89;
  --color-focus: #2B22F0;

  --color-expressive-mint: #3ED9C0;
  --color-expressive-amber: #FFC53D;
  --color-expressive-violet: #B24BF3;
  --color-expressive-orange: #F97316;
  --color-expressive-overlap: #2B22F0;

  --color-success: #15795A;
  --color-warning: #8A5A00;
  --color-error: #C42B1C;
  --color-info: #2B22F0;

  /* Typography */
  --font-display: 'Barlow', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --type-display-family: var(--font-display);
  --type-display-size: 64px;  --type-display-weight: 800; --type-display-lh: 0.95; --type-display-ls: -0.02em;
  --type-h1-family: var(--font-display);
  --type-h1-size: 44px;       --type-h1-weight: 800;      --type-h1-lh: 1.02;     --type-h1-ls: -0.02em;
  --type-h2-family: var(--font-display);
  --type-h2-size: 32px;       --type-h2-weight: 700;      --type-h2-lh: 1.1;      --type-h2-ls: -0.015em;
  --type-h3-family: var(--font-display);
  --type-h3-size: 22px;       --type-h3-weight: 700;      --type-h3-lh: 1.2;      --type-h3-ls: -0.01em;
  --type-body-lg-family: var(--font-body);
  --type-body-lg-size: 19px;  --type-body-lg-weight: 400; --type-body-lg-lh: 1.65;--type-body-lg-ls: -0.005em;
  --type-body-family: var(--font-body);
  --type-body-size: 16px;     --type-body-weight: 400;    --type-body-lh: 1.7;    --type-body-ls: 0em;
  --type-body-sm-family: var(--font-body);
  --type-body-sm-size: 14px;  --type-body-sm-weight: 400; --type-body-sm-lh: 1.6; --type-body-sm-ls: 0em;
  --type-caption-family: var(--font-body);
  --type-caption-size: 13px;  --type-caption-weight: 400; --type-caption-lh: 1.5; --type-caption-ls: 0.01em;
  --type-label-family: var(--font-body);
  --type-label-size: 11px;    --type-label-weight: 600;   --type-label-lh: 1.2;   --type-label-ls: 0.18em;
  --type-quote-family: var(--font-display);
  --type-quote-size: 26px;    --type-quote-weight: 600;   --type-quote-lh: 1.35;  --type-quote-ls: -0.01em;
  --type-code-family: var(--font-mono);
  --type-code-size: 14px;     --type-code-weight: 400;    --type-code-lh: 1.6;    --type-code-ls: 0em;

  /* Rounded — exactly two values. There is no "slightly rounded". */
  --rounded-none: 0px;
  --rounded-full: 9999px;

  /* Spacing */
  --space-0: 0px;  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --space-8: 64px; --space-9: 96px; --space-10: 128px;
}

[data-theme="dark"] {
  --color-background: #0D0D0C;
  --color-surface: #1A1A18;
  --color-surface-sunken: #000000;
  --color-on-background: #F4F3F1;
  --color-on-surface: #F4F3F1;
  --color-on-surface-muted: #A3A29C;
  --color-on-surface-subtle: #6E6D68;
  --color-border: #2E2E2B;
  --color-border-strong: #F4F3F1;

  --color-action: #F4F3F1;
  --color-on-action: #0D0D0C;
  --color-action-hover: #FFFFFF;
  --color-action-active: #DAD8D3;
  --color-action-disabled: #3A3A36;
  --color-on-action-disabled: #6E6D68;
  --color-focus: #6B63FF;

  --color-expressive-mint: #4FE8CF;
  --color-expressive-amber: #FFD166;
  --color-expressive-violet: #C77BFF;
  --color-expressive-orange: #FF8A3D;
  --color-expressive-overlap: #6B63FF;

  --color-success: #3FD69A;
  --color-warning: #FFC53D;
  --color-error: #FF6B5A;
  --color-info: #6B63FF;
}

/* ---- Type utilities ---- */
.t-display  { font-family: var(--type-display-family); font-size: var(--type-display-size); font-weight: var(--type-display-weight); line-height: var(--type-display-lh); letter-spacing: var(--type-display-ls); }
.t-h1       { font-family: var(--type-h1-family); font-size: var(--type-h1-size); font-weight: var(--type-h1-weight); line-height: var(--type-h1-lh); letter-spacing: var(--type-h1-ls); }
.t-h2       { font-family: var(--type-h2-family); font-size: var(--type-h2-size); font-weight: var(--type-h2-weight); line-height: var(--type-h2-lh); letter-spacing: var(--type-h2-ls); }
.t-h3       { font-family: var(--type-h3-family); font-size: var(--type-h3-size); font-weight: var(--type-h3-weight); line-height: var(--type-h3-lh); letter-spacing: var(--type-h3-ls); }
.t-body-lg  { font-family: var(--type-body-lg-family); font-size: var(--type-body-lg-size); font-weight: var(--type-body-lg-weight); line-height: var(--type-body-lg-lh); letter-spacing: var(--type-body-lg-ls); }
.t-body     { font-family: var(--type-body-family); font-size: var(--type-body-size); font-weight: var(--type-body-weight); line-height: var(--type-body-lh); letter-spacing: var(--type-body-ls); }
.t-body-sm  { font-family: var(--type-body-sm-family); font-size: var(--type-body-sm-size); font-weight: var(--type-body-sm-weight); line-height: var(--type-body-sm-lh); letter-spacing: var(--type-body-sm-ls); }
.t-caption  { font-family: var(--type-caption-family); font-size: var(--type-caption-size); font-weight: var(--type-caption-weight); line-height: var(--type-caption-lh); letter-spacing: var(--type-caption-ls); }
.t-label    { font-family: var(--type-label-family); font-size: var(--type-label-size); font-weight: var(--type-label-weight); line-height: var(--type-label-lh); letter-spacing: var(--type-label-ls); text-transform: uppercase; }
.t-quote    { font-family: var(--type-quote-family); font-size: var(--type-quote-size); font-weight: var(--type-quote-weight); line-height: var(--type-quote-lh); letter-spacing: var(--type-quote-ls); }
.t-code     { font-family: var(--type-code-family); font-size: var(--type-code-size); font-weight: var(--type-code-weight); line-height: var(--type-code-lh); letter-spacing: var(--type-code-ls); }

/* ---- Base ---- */
body {
  margin: 0;
  background: var(--color-background);
  color: var(--color-on-background);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ---- Artboard primitives ---- */
.artboard { padding: var(--space-8); min-height: 100%; background: var(--color-background); }

.btn {
  font-family: var(--type-label-family); font-size: var(--type-label-size);
  font-weight: var(--type-label-weight); letter-spacing: var(--type-label-ls);
  text-transform: uppercase; line-height: var(--type-label-lh);
  border-radius: var(--rounded-none);   /* NEVER change this */
  height: 52px; padding: 0 var(--space-5); border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  background: var(--color-action); color: var(--color-on-action);
}
.btn:hover { background: var(--color-action-hover); }
.btn-ghost { background: transparent; color: var(--color-action); border-color: var(--color-border-strong); }
.btn-ghost:hover { background: var(--color-action); color: var(--color-on-action); }
.btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

.card {
  background: var(--color-surface); color: var(--color-on-surface);
  border: 1px solid var(--color-border);            /* depth = border, never shadow */
  border-radius: var(--rounded-none); padding: var(--space-6);
}
.card:hover { border-color: var(--color-border-strong); }   /* sharpens, never lifts */

.inp {
  width: 100%; height: 52px; padding: 0 var(--space-4);
  background: var(--color-surface); color: var(--color-on-surface);
  border: 1px solid var(--color-border); border-radius: var(--rounded-none);
  font-family: var(--type-body-family); font-size: var(--type-body-size);
}
.inp:focus { border-color: var(--color-border-strong); outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* Expressive geometry — one colour per artboard, large, never on a control */
.mark { display: block; }
.mark-ring { width: 220px; height: 220px; border: 40px solid var(--color-expressive-mint); border-radius: var(--rounded-full); }
.mark-bar  { width: 64px; height: 220px; background: var(--color-expressive-violet); }
.mark-rule { width: 100%; height: 12px; background: var(--color-expressive-amber); }
/* Shape crossing a photo: wrap the shape in .overlap so the intersection
   renders in --color-expressive-overlap. This is the system signature. */
.overlap { mix-blend-mode: multiply; }
</style>

<div class="artboard">
  <p class="t-label" style="color:var(--color-on-surface-muted)">Eyebrow</p>
  <h1 class="t-display" style="margin:var(--space-4) 0 var(--space-5)">Headline</h1>
  <p class="t-body" style="max-width:60ch;color:var(--color-on-surface-muted);margin:0 0 var(--space-7)">
    Supporting copy in Inter. Body never uses Barlow.
  </p>
  <div style="display:flex;gap:var(--space-4);margin-bottom:var(--space-8)">
    <button class="btn">Primary action</button>
    <button class="btn btn-ghost">Secondary</button>
  </div>
  <span class="mark mark-ring"></span>
</div>
